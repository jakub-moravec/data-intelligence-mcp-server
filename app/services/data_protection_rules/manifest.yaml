service:
  name: data_protection_rules
  description: "Tools for creating and managing data protection rules to enforce data governance policies. This service enables defining rules based on asset attributes, data classes, and business classifications with configurable actions (allow/deny) to control data access and usage. Supports searching and filtering rules by name or description to maintain compliance and security across the data platform. Also provides tools to search for governance artifacts like classifications, data classes, and glossary terms."
system_instructions: |
  Tools for creating and managing data protection rules to enforce data governance policies. This service enables defining rules based on asset attributes, data classes, and business classifications with configurable actions (allow/deny) to control data access and usage. Supports searching and filtering rules by name or description to maintain compliance and security across the data platform.
  
  Data Protection Rules Tools:
  1. get_data_protection_rule_schema - Get the complete JSON schema, valid terms, and examples for creating data protection rules. Call this FIRST before creating a rule.
  2. create_data_protection_rule - Create a new data protection rule from JSON string. Call get_data_protection_rule_schema() first to understand the format.
  3. search_data_protection_rules - Search data protection rule by query filter. NOTE: Data protection rules are NOT governance artifacts — do NOT include them in governance artifact counts or type listings.
  4. search_governance_artifacts - Search for governance artifacts by query. Supports all 6 governance artifact types: 'classification', 'data_class', 'glossary_term' (business terms), 'policy', 'rule', and 'reference_data'. Use this for counting/listing governance artifacts, NOT search_data_protection_rules or category searches.
  5. get_policy_metrics - Retrieve and aggregate DPS (Data Privacy and Security) policy enforcement metrics for a specified time period. Requires specifying a metrics_type (enforcements, denials, operational_policies, or operational_rules) and an aggregation_type. Supports optional filters for policy, rule, user, governance type, and outcome.
